events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirections des anciennes URLs legacy .html
        location = /liste_contrat_be.html { return 301 /liste-contrats; }
        location = /liste_contrat_cp.html { return 301 /liste-contrats; }
        location = /liste_contrat_cptparraine.html { return 301 /liste-contrats; }
        location = /liste_contrat.html { return 301 /liste-contrats; }
        location = /contrat.html { return 301 /liste-contrats; }
        location = /contract.html { return 301 /liste-contrats; }
        location = /detail_contrat.html { return 301 /liste-contrats; }
        location = /contrat_hla.html { return 301 /liste-contrats?filter=hla; }
        location = /cotation.html { return 301 /ajouter-cotation; }
        location = /bouclier.html { return 301 /ajouter-cotation; }
        location = /customers_liste.html { return 301 /liste-clients; }
        location = /add_customer.html { return 301 /liste-clients; }
        location = /etat_prod.html { return 301 /generer-etat-production; }
        location = /liste_users.html { return 301 /liste-utilisateurs; }
        location = /agency.html { return 301 /liste-agences; }
        location = /profil.html { return 301 /profile; }
        location = /home.html { return 301 /tableau_bord; }
        location = /forgot-password.html { return 301 /forgot-password; }

        # Redirection de secours pour tout autre fichier .html (sauf index.html)
        location ~ ^/(?!index\.html).*\.html$ {
            return 301 /tableau_bord;
        }

        # Serve frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api {
            proxy_pass http://renaca-backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Headers pour les requêtes POST/PUT/DELETE
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            
            # Configuration pour les requêtes longues
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Cache pour les assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    }
}